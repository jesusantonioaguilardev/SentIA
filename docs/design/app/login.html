px", "letterSpacing": "-0.01em", "fontWeight": "600"}] } } } };</script></head><body class="bg-surface font-body-md text-on-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full max-w-md mx-auto min-w-0 pb-space-xl">
<!-- Atmospheric Subtle Glow Elements -->
<div class="relative w-full flex flex-col items-center">
<div class="absolute -top-12 w-64 h-64 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-20 right-4 w-48 h-48 bg-secondary-fixed/40 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- App Identity & Calming Halo -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-lg">
<div class="relative flex items-center justify-center p-3 mb-space-sm">
<div class="absolute inset-0 rounded-full bg-surface-container-low scale-110 shadow-sm animate-pulse" style="animation-duration: 4s;"></div>
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center p-3 overflow-hidden">
<img alt="SentIA Wellness Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WiTH1Ra4ulRGJ-DiEloPjaYmjqq7Gv6FYMhJVZExhuhZH32Lk9xctz6afF_KPnC65U2DZBdqt3xbN9okrvp4AIFxLV-7d9PYwuDkJMz-cUGj6VXQOAYzvDvaIqgvChIUecSYy5F8htHFh6KbjlIZ0XzdKGz0O6BhO_tk8HqNElcclvsTQPOPPhL0dH0Z3JEqgVvQ4euHLTAs85QCh4nbuWH6fHAFL44XbTeiIxphQYA1vo8vdc86OJ6jBe">
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-1">SentIA</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs px-2 leading-relaxed">
        Un espacio para hablar y sentirte acompañado.
      </p>
<!-- Privacy Pill Indicator -->
<div class="mt-space-md inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-tertiary-fixed/40 text-on-tertiary-fixed-variant shadow-sm">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-sm text-label-sm font-medium">Tu espacio personal y seguro</span>
</div>
</div>
<!-- Login Surface Card -->
<div class="w-full bg-surface-container-lowest rounded-lg p-space-lg shadow-sm">
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium pl-1" for="emailInput">
            Correo electrónico
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px] pointer-events-none">
              mail
            </span>
<input class="w-full pl-12 pr-4 py-3.5 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-2xl outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-200" id="emailInput" placeholder="tu@correo.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium pl-1" for="passwordInput">
            Contraseña
          </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline text-[20px] pointer-events-none">
              lock
            </span>
<input class="w-full pl-12 pr-12 py-3.5 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-2xl outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-200" id="passwordInput" placeholder="••••••••" required="" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3 p-1.5 text-outline hover:text-on-surface transition-colors flex items-center justify-center rounded-full" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">
                visibility
              </span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors py-0.5" href="#">
              ¿Olvidaste tu contraseña?
            </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-space-xs py-3.5 px-6 rounded-full bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-label-lg text-label-lg font-medium shadow-sm transition-all duration-200 flex items-center justify-center gap-2" type="submit">
<span class="">Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Gentle Separator -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-3 bg-surface-container-lowest font-body-sm text-body-sm text-outline">o</span>
</div>
<!-- Google Social Sign-In -->
<button class="w-full py-3.5 px-4 rounded-full bg-surface-container-low hover:bg-surface-container active:scale-[0.99] text-on-surface font-label-lg text-label-lg font-medium shadow-sm transition-all duration-200 flex items-center justify-center gap-3" type="button">
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Continuar con Google</span>
</button>
</div>
<!-- Footer Action -->
<div class="mt-space-lg text-center font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-1.5">
<span class="">¿No tienes una cuenta?</span>
<a class="font-headline-sm text-label-lg text-secondary hover:text-on-secondary-container transition-colors underline-offset-4 hover:underline" href="#">
        Crear cuenta
      </a>
</div>
<!-- Tactile Calm Anchor -->
<div class="mt-space-lg flex items-center gap-2 text-outline text-opacity-70">
<span class="material-symbols-outlined text-[16px] text-secondary">spa</span>
<span class="font-label-sm text-label-sm tracking-wide text-on-surface-variant">Tómate un respiro antes de continuar</span>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('passwordInput');
    const pwdIcon = document.getElementById('passwordIcon');

    if (toggleBtn && pwdInput && pwdIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

</body></html>
