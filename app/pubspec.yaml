name: sentia2
description: "SentIA — app de apoyo emocional asistido por IA. Ver ../docs/."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Dependencias nuevas: justificar y pedir aprobación (docs/11).
dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  # 9.x depende de material_ui (Material fuera del SDK); incompatible con
  # flutter/material de Flutter 3.47. Revisar al migrar a material_ui.
  google_fonts: ^8.2.1
  hooks_riverpod: ^3.4.3
  intl: any # versión fijada por flutter_localizations
  json_annotation: ^4.12.0
  logger: ^2.8.0
  riverpod_annotation: ^4.0.7
  sentia_api:
    path: packages/sentia_api # generado desde backend/openapi.yaml
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
