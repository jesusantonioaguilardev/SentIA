# Base de datos local para desarrollo. Credenciales solo de desarrollo.
# Imagen con pgvector desde ya para no migrar de imagen en Etapa 5 (RAG, docs/06).
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentia
      POSTGRES_PASSWORD: sentia_dev
      POSTGRES_DB: sentia
    ports:
      - "5432:5432"
    volumes:
      - sentia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentia -d sentia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sentia-db:
