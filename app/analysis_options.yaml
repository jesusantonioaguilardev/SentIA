# Lints estrictos (docs/02 Etapa 0). Cualquier excepción aquí debe explicar el porqué.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - packages/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Los TODO son válidos si llevan etiqueta (docs/11): TODO(clinico|legal|etapa-N).
    todo: ignore

linter:
  rules:
    # docs/11 exige /// solo en las APIs públicas de domain/, no en toda la app.
    public_member_api_docs: false
    # Los TODO del proyecto usan etiquetas, no usuarios ni enlaces a issues.
    flutter_style_todos: false
